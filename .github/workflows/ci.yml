name: research-ci

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked research dependencies
        run: python -m pip install -r requirements.lock
      - name: Compile package
        run: python -m compileall -q gpu_fuzzy_trader
      - name: Focused low-memory tests
        env:
          PYTEST_LOW_MEMORY: "1"
        run: >
          python -m pytest -q
          tests/unit/test_config_validation.py
          tests/unit/test_output_writer.py
          tests/unit/test_phase5_oos.py
          tests/unit/test_rb_min_symbols.py

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-fuzzy-trader"
version = "0.1.0"
description = "Auditable GPU-accelerated fuzzy-rule research pipeline for crypto strategies"
requires-python = ">=3.10"
license = {text = "All rights reserved"}
readme = "README.md"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26,<2.4",
  "numba>=0.58",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyarrow>=14.0",
  "jax>=0.4.20",
  "jaxlib>=0.4.20",
  "evox>=1.0.0,<2",
  "torch>=2.0",
  "optuna>=3.5.0",
]

[project.optional-dependencies]
test = [
  "pytest>=7.4.0",
  "hypothesis>=6.90.0",
]

[tool.setuptools.packages.find]
include = ["gpu_fuzzy_trader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
